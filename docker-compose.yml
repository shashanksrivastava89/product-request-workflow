# Docker Compose - Development Mode
# For local development with hot reload and volume mounts.
# Note: 'version' is obsolete in Compose V2; removed to avoid warnings.
#
# Default: backend uses your LOCAL DB (japanautomation on host) via host.docker.internal.
#   Ensure PostgreSQL is running on the host with DB "japanautomation".
#   Run: docker compose up
# To use the in-container Postgres (salesform) instead:
#   Run: docker compose --profile postgres up
#   And set: DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/salesform?schema=public

services:
  postgres:
    profiles:
      - postgres
    image: postgres:15-alpine
    container_name: salesform-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: salesform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salesform-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: salesform-backend-dev
    env_file:
      - ./backend/.env
    extra_hosts:
      # Reach host PostgreSQL from container (needed on Linux; Windows/Mac have it built-in)
      - "host.docker.internal:host-gateway"
    environment:
      # Override: use host DB (japanautomation) from container; backend/.env uses localhost
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:contact-42660d@outside.example:5432/japanautomation?schema=public}
    ports:
      - "3000:3000"
    # Backend uses host DB (japanautomation) by default; no need to wait for postgres container.
    volumes:
      # Mount source code for hot reload (development only)
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      # Exclude node_modules from mount
      - /app/node_modules
    networks:
      - salesform-network
    # Override command for development (use nodemon). Run migrations so DB has tables.
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    restart: unless-stopped

  frontend:
    # For development, use Vite dev server directly (better for hot reload)
    image: node:18-alpine
    container_name: salesform-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:3000/api
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - salesform-network
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  salesform-network:
    driver: bridge
